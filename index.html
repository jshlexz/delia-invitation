<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delia's Celebration</title>

    <meta
        name="description"
        content="Delia's Celebration - Maria Delia Bedu"
    >

    <!-- GOOGLE FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="gaya.css"
    >

</head>


<body>


    <!-- =================================
         OPENING SCREEN
    ================================== -->

    <section
        id="openingScreen"
        class="opening-screen"
    >

        <!-- Ornamen sudut -->

        <div class="opening-flower flower-top-left">
            ❀
        </div>

        <div class="opening-flower flower-top-right">
            ✿
        </div>

        <div class="opening-flower flower-bottom-left">
            ✿
        </div>

        <div class="opening-flower flower-bottom-right">
            ❀
        </div>


        <div class="opening-content">


            <p class="opening-subtitle">
                A SPECIAL CELEBRATION
            </p>


            <!-- FOTO UTAMA -->

            <div class="cover-frame">

                <div class="cover-photo">

                    <img
                        src="aktiva/delia-cover.jpg"
                        alt="Maria Delia Bedu"
                    >

                </div>

            </div>


            <p class="invited-text">
                YOU ARE INVITED TO
            </p>


            <h1>
                Delia's
                <span>Celebration</span>
            </h1>


            <!-- SALIB -->

            <div class="cross-area">

                <div class="cross">

                    <span class="cross-vertical"></span>

                    <span class="cross-horizontal"></span>

                </div>


                <div class="cross-flowers">
                    ✿ ❀ ✿
                </div>

            </div>


            <!-- OPEN -->

            <button
                id="openInvitation"
                class="open-button"
            >

                <span>
                    OPEN INVITATION
                </span>

                <span class="arrow">
                    ↓
                </span>

            </button>


        </div>

    </section>



    <!-- =================================
         BACKGROUND MUSIC
    ================================== -->

    <audio
        id="backgroundMusic"
        loop
        preload="auto"
    >

        <source
            src="aktiva/lagu-delia.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- TOMBOL MUSIK -->

    <button
        id="musicButton"
